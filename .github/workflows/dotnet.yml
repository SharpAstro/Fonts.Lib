name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Minor bump 1.6 -> 1.7: faces can now report who they are. OpenTypeFont.Name
  # and .Os2 parse the 'name' / 'OS/2' tables lazily (rendering never reads
  # them), IsSymbolEncoded flags the legacy (3,0)-cmap fonts, and FontFaceReader
  # lists a file's faces — family, subfamily, PostScript name, weight, style,
  # and the collection index needed to reach any face past the first in a .ttc —
  # by seeking to those two tables instead of loading the font. Purely additive.
  #
  # Minor bump 1.3 -> 1.4: 'cmap' table is now optional. PDF Identity-H subset
  # fonts routinely strip the cmap (CID maps directly to GID; Unicode lookup
  # lives in the PDF's /ToUnicode CMap instead) and previously failed to load
  # with "Missing required 'cmap' table". OpenTypeFont.Cmap is now nullable;
  # GetGlyphId handles the null case for CharCodeIsGID / EmbeddedSubset hints.
  # Source-compatible for callers that always go through GetGlyphId — direct
  # readers of the Cmap property must accommodate nullability.
  # The NUMBER is deliberately not here any more: it lives in the repo-root
  # Directory.Build.props (VersionMajorMinor) and the build job reads it back, so it
  # cannot drift from what the two packages declare. Add the release note above when
  # you bump it there. (The notes stay in this file because several contain a double
  # hyphen, which is illegal inside an XML comment.)
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The build job CAPTURES a dotnet invocation's stdout to resolve the version, so the
  # SDK's first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      # Read the major.minor back from the one place it is written (Directory.Build.props) instead of
      # restating it here. -getProperty only EVALUATES the file: nothing is built and no restore is
      # needed, so this can run before restore. The value is CAPTURED, so nothing else may print to
      # stdout: DOTNET_NOLOGO (workflow env) keeps the SDK first-run banner out, and the shape check
      # makes anything unexpected, or a renamed property, fail the run rather than quietly publishing
      # both packages as ".<run>".
      run: |
        MM="$(dotnet msbuild Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test -c $BUILD_CONF --no-build --verbosity normal
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}
